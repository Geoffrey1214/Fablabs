<style>

html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--tq2)}
#app{display:flex;min-height:100vh}
nav{width:250px;background:var(--navy);color:#fff;padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .logo{font-weight:700;font-size:18px;padding:6px 10px 14px;color:#fff}nav .logo span{color:var(--tq)}
nav a{display:block;padding:10px 12px;border-radius:8px;color:#d5e3f3;text-decoration:none;font-size:15px}
nav a:hover,nav a:focus-visible{background:var(--navy2);outline:2px solid var(--tq)}nav a.on{background:var(--tq);color:#04231f;font-weight:600}
main{flex:1;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}
#burger{display:none}
.wrap{padding:16px;max-width:1100px;margin:0 auto}
.banner{background:#fff4d6;color:#5b4300;border:1px solid #e6c766;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat b{display:block;font-size:30px;color:var(--tq2)}.stat span{color:var(--mu);font-size:14px}
button,.btn{background:var(--tq);color:#04231f;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;display:inline-block}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.dng{background:var(--er);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--tx);min-height:44px}
.err{color:var(--er);font-size:13px;margin-top:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1;min-width:140px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#d6f5f0;color:#0a5a52}
.tag.ko{background:#fde2e2;color:#8f1d1d}.tag.wa{background:#ffecc7;color:#6b4200}.tag.ok{background:#d9f2e3;color:#145c37}
.empty{text-align:center;color:var(--mu);padding:28px 10px;border:2px dashed var(--bd);border-radius:10px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:28px 20px;margin-bottom:14px;background-image:radial-gradient(circle at 90% 20%,rgba(20,184,166,.35),transparent 40%),linear-gradient(135deg,var(--navy),var(--navy2))}
.hero h2{font-size:clamp(24px,5vw,38px);margin:0 0 8px}.hero p{max-width:60ch;color:#cfe0f2}
.vid{aspect-ratio:16/9;background:var(--navy);color:#cfe0f2;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;width:100%}
video{width:100%;border-radius:10px;background:#000}
.bar{height:14px;background:var(--tq);border-radius:7px;min-width:3px}
.tile{height:90px;border-radius:8px;margin-bottom:8px;background:linear-gradient(135deg,var(--navy2),var(--tq));display:flex;align-items:center;justify-content:center}.tile svg{height:100%;width:auto;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.pl{position:relative;aspect-ratio:16/9;min-height:220px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 16px 22px}.pl svg{width:110px;height:66px;fill:none;stroke:var(--tq);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.pl h3{margin:6px 0;font-size:clamp(18px,4vw,26px)}.pl p{max-width:48ch;color:#cfe0f2;margin:0}
#ps{display:flex;flex-direction:column;align-items:center;animation:fi .6s}@keyframes fi{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){#ps{animation:none}}
.pb{height:5px;background:rgba(255,255,255,.2);position:absolute;left:0;bottom:0;width:100%}.pb i{display:block;height:100%;background:var(--tq);width:0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(5,15,30,.6)}
@media (max-width:820px){#burger{display:inline-block}nav{position:fixed;left:-270px;z-index:20;transition:left .2s}nav.open{left:0}}
</style></head>

tableau:()=>{const t=iso(0),rj=S.resa.filter(r=>r.date==t).length;return`<div class="grid"><div class="card stat"><b>${S.eleves.filter(e=>e.statut=="Actif").length}</b><span>Apprenants actifs</span></div><div class="card stat"><b>${S.machines.filter(m=>m.dispo).length}/${S.machines.length}</b><span>Machines disponibles</span></div><div class="card stat"><b>${rj}</b><span>Réservations du jour</span></div><div class="card stat"><b>${S.projets.filter(p=>p.s=="En cours").length}</b><span>Projets en cours</span></div></div><h2>Activités récentes</h2><div class="card">${S.act.length?S.act.map(a=>`<p>${esc(a.date)} · ${esc(a.t)}</p>`).join(""):empty("Aucune activité.")}</div>`},
eleves:()=>{const l=S.eleves.filter(e=>e.nom.toLowerCase().includes(F.q.toLowerCase())&&(!F.f||e.niveau==F.f));return`<div class="row"><div><label for="q">Rechercher</label><input id="q" data-f="q" value="${esc(F.q)}" placeholder="Nom"></div><div><label for="fl">Niveau</label><select id="fl" data-f="f"><option value="">Tous</option>${["Seconde","Première","Terminale"].map(n=>`<option ${F.f==n?"selected":""}>${n}</option>`).join("")}</select></div></div><button data-a="eleve-form">+ Ajouter un élève</button><div class="tw card" style="margin-top:12px">${l.length?`<table><tr><th>Nom</th><th>Niveau</th><th>Classe</th><th>Statut</th><th></th></tr>${l.map(e=>`<tr><td>${esc(e.nom)}</td><td>${e.niveau}</td><td>${esc(e.classe)}</td><td>${tag(e.statut,e.statut=="Actif"?"ok":"wa")}</td><td><button class="sec" data-a="eleve-voir" data-id="${e.id}">Fiche</button> <button class="sec" data-a="eleve-form" data-id="${e.id}">Modifier</button> ${dl("eleves",S.eleves.indexOf(e))}</td></tr>`).join("")}</table>`:empty("Aucun élève ne correspond à la recherche.")}</div>`},
formateurs:()=>addB("formateurs")+(S.formateurs.length?`<div class="grid">${S.formateurs.map((f,i)=>`<div class="card"><b>${esc(f.nom)}</b><p>${esc(f.spe)}</p><p>Tél. : ${esc(f.tel||"—")}</p><p>Encadre : ${esc(f.act||"—")}</p>${dl("formateurs",i)}</div>`).join("")}</div>`:empty("Aucun formateur. Ajoutez le premier.")),
machines:()=>{const l=S.machines.filter(m=>m.nom.toLowerCase().includes(F.mq.toLowerCase())&&(!F.mc||m.cat==F.mc));return addB("machines")+`<div class="row"><div><label for="mq">Rechercher</label><input id="mq" data-f="mq" value="${esc(F.mq)}"></div><div><label for="mc">Catégorie</label><select id="mc" data-f="mc"><option value="">Toutes</option>${[...new Set(S.machines.map(m=>m.cat))].map(c=>`<option ${F.mc==c?"selected":""}>${c}</option>`).join("")}</select></div></div>${l.length?`<div class="grid">${l.map(m=>`<div class="card"><b>${esc(m.nom)}</b> ${tag(m.dispo?"Disponible":"Indisponible",m.dispo?"ok":"ko")}<p>${esc(m.desc)}</p><p>État : ${esc(m.etat)}</p><p><small>Règle : ${esc(m.regle||"—")}</small></p>${dl("machines",S.machines.indexOf(m))}</div>`).join("")}</div>`:empty("Aucun équipement trouvé.")}`},
reservations:()=>{const g={};S.resa.slice().sort((a,b)=>(a.date+a.deb).localeCompare(b.date+b.deb)).forEach(r=>(g[r.date]=g[r.date]||[]).push(r));return`<div class="card"><h2 style="margin-top:0">Nouvelle réservation</h2><form id="fr" novalidate><label for="rm">Équipement</label><select id="rm" name="mid"><option value="">Choisir…</option>${S.machines.map(m=>`<option value="${m.id}">${esc(m.nom)}${m.dispo?"":" (indisponible)"}</option>`).join("")}</select><div class="err" data-e="mid"></div><div class="row"><div><label for="rd">Date</label><input id="rd" type="date" name="date"><div class="err" data-e="date"></div></div><div><label for="rdb">Début</label><input id="rdb" type="time" name="deb"></div><div><label for="rf">Fin</label><input id="rf" type="time" name="fin"><div class="err" data-e="fin"></div></div></div><label for="rmo">Motif</label><input id="rmo" name="motif" maxlength="100"><div class="err" data-e="motif"></div><p><small>Détection des conflits simulée côté interface : une validation serveur reste à connecter.</small></p><button>Réserver</button></form></div><h2>Calendrier</h2>${S.resa.length?Object.keys(g).map(d=>`<div class="card" style="margin-bottom:8px"><b>${d}</b>${g[d].map(r=>`<p>${r.deb}–${r.fin} · ${esc(mname(r.mid))} · ${esc(r.motif)} ${tag(r.st,r.st=="Confirmée"?"ok":r.st=="Annulée"?"ko":"wa")}<br><select data-a="resa-st" data-id="${r.id}" aria-label="Statut" style="width:auto">${["En attente","Confirmée","Annulée"].map(s=>`<option ${r.st==s?"selected":""}>${s}</option>`).join("")}</select></p>`).join("")}</div>`).join(""):empty("Aucune réservation. Utilisez le formulaire ci-dessus.")}`},
projets:()=>addB("projets")+(S.projets.length?`<div class="grid">${S.projets.map((p,i)=>`<div class="card">${ill(p.c)}<b>${esc(p.t)}</b><p>${esc(p.d)}</p><p>${tag(p.c)} ${tag(p.s,p.s=="Terminé"?"ok":"wa")}</p><small>Participants : ${esc(p.p||"—")}</small><p>${dl("projets",i)}</p></div>`).join("")}</div>`:empty("Aucun projet. Ajoutez le premier.")),
formations:()=>addB("forma")+(S.forma.length?`<div class="grid">${S.forma.map((f,i)=>`<div class="card"><b>${esc(f.t)}</b><p>${tag(f.niv)} ${tag(f.dur)}</p><p>${esc(f.d)}</p><small>Ressources : ${esc(f.res||"—")}</small><p>${dl("forma",i)}</p></div>`).join("")}</div>`:empty("Aucune formation.")),
activites:()=>addB("act")+(S.act.length?`<div class="card">${S.act.map((a,i)=>({a,i})).sort((x,y)=>x.a.date.localeCompare(y.a.date)).map(({a,i})=>`<p><b>${esc(a.date)}</b> · ${esc(a.t)} ${tag(a.type)} ${dl("act",i)}</p>`).join("")}</div>`:empty("Aucune activité planifiée. Ajoutez la première.")),
notifications:()=>`<div class="card"><h2 style="margin-top:0">Envoyer une notification (simulée)</h2><div class="banner">Envoi simulé : aucun service de messagerie n’est connecté, rien n’est réellement délivré.</div><form id="fn" novalidate><label for="nd">Destinataires</label><select id="nd" name="dest"><option value="all">Tous les apprenants actifs</option>${S.eleves.map(e=>`<option value="${e.id}">${esc(e.nom)}</option>`).join("")}</select><label for="no">Objet</label><input id="no" name="obj" maxlength="80"><div class="err" data-e="obj"></div><label for="nc">Contenu</label><textarea id="nc" name="txt" rows="4"></textarea><div class="err" data-e="txt"></div><p><button>Voir l’aperçu</button></p></form></div><h2>Notifications reçues</h2>${S.notifs.length?S.notifs.map(n=>`<div class="card" style="margin-bottom:8px">${n.date} · ${esc(n.txt)} ${tag(n.lu?"Lue":"Non lue",n.lu?"":"wa")} <button class="sec" data-a="notif-lu" data-id="${n.id}">${n.lu?"Marquer non lue":"Marquer lue"}</button></div>`).join(""):empty("Aucune notification.")}<h2>Envois simulés</h2>${S.envois.length?S.envois.map(e=>`<div class="card" style="margin-bottom:8px">${tag("Simulé","wa")} ${esc(e.obj)} → ${esc(e.dest)}</div>`).join(""):empty("Aucun envoi simulé pour l’instant.")}`,
rapports:()=>{const n=F.per=="all"?9999:+F.per,lim=iso(n),r=S.resa.filter(x=>x.date>=iso(-n)&&x.date<=iso(n));const c={};r.forEach(x=>c[mname(x.mid)]=(c[mname(x.mid)]||0)+1);const mx=Math.max(1,...Object.values(c));return`<label for="per">Période (autour d’aujourd’hui)</label><select id="per" data-f="per" style="max-width:240px">${[["7","7 jours"],["30","30 jours"],["all","Tout"]].map(([v,t])=>`<option value="${v}" ${F.per==v?"selected":""}>${t}</option>`).join("")}</select><div class="grid" style="margin-top:12px"><div class="card stat"><b>${S.eleves.length}</b><span>Apprenants</span></div><div class="card stat"><b>${S.machines.length}</b><span>Équipements</span></div><div class="card stat"><b>${r.length}</b><span>Réservations</span></div><div class="card stat"><b>${S.projets.length}</b><span>Projets</span></div></div><h2>Réservations par équipement</h2><div class="card">${Object.keys(c).length?Object.entries(c).map(([k,v])=>`<p>${esc(k)} (${v})<div class="bar" style="width:${v/mx*100}%"></div></p>`).join(""):empty("Aucune réservation sur cette période.")}</div>`},
parametres:()=>`<div class="card"><form id="fs" novalidate><label for="sn">Nom du FabLab</label><input id="sn" name="nom" value="${esc(S.fab.nom)}"><div class="err" data-e="nom"></div><label for="sv">Ville</label><input id="sv" name="ville" value="${esc(S.fab.ville)}"><label for="se">E-mail</label><input id="se" name="email" value="${esc(S.fab.email)}"><div class="err" data-e="email"></div><label for="st">Téléphone</label><input id="st" name="tel" value="${esc(S.fab.tel)}"><label for="th">Affichage</label><select id="th"><option value="">Automatique</option><option value="light">Clair</option><option value="dark">Sombre</option></select><p><button>Enregistrer</button></p></form></div>`,
admin:()=>{if($("#role").value!="Administrateur")return`<div class="empty"><b>Accès réservé aux administrateurs.</b><br>Choisissez le rôle « Administrateur » en haut de la page. Ce sélecteur est une simulation : l’authentification réelle reste à implémenter.</div>`;return`<div class="banner">Interface de démonstration : sans authentification ni contrôle serveur, ces droits ne sont pas sécurisés.</div><div class="card tw"><table><tr><th>Utilisateur</th><th>Rôle</th><th>Autorisations</th></tr>${S.users.map(u=>`<tr><td>${esc(u.nom)}</td><td>${u.role}</td><td>${u.role=="Administrateur"?"Tout gérer":u.role=="Formateur"?"Réservations, projets":"Consultation"}</td></tr>`).join("")}</table></div>`}};
R.admin=()=>!ADM?`<div class="empty"><b>Accès réservé aux administrateurs.</b></div>`:`<div class="card tw"><h2 style="margin-top:0">Utilisateurs et rôles</h2><table><tr><th>E-mail</th><th>Rôle</th></tr>${ULIST.map(u=>`<tr><td>${esc(u.email)}</td><td><select data-a="role" data-uid="${esc(u.id)}" aria-label="Rôle">${[["apprenant","Apprenant (consultation)"],["formateur","Formateur (saisie)"],["admin","Administrateur"]].map(([v,t])=>`<option value="${v}" ${u.role==v?"selected":""}>${t}</option>`).join("")}</select></td></tr>`).join("")}</table>${ULIST.length?"":empty("Aucun utilisateur.")}<p><button data-a="export">Exporter les données (JSON)</button> <button class="dng" data-a="reset">Vider toutes les données</button></p></div>`;
function nav(){const p=(location.hash.slice(2)||"accueil");$("#nav").innerHTML=`<div class="logo">Fab<span>Lab</span> Innovation Togo</div>`+PAGES.map(([k,t])=>`<a href="#/${k}" class="${k==p?"on":""}" ${k==p?'aria-current="page"':""}>${t}</a>`).join("");}
function draw(){let p=location.hash.slice(2)||"accueil";if(!R[p]){p="accueil"}nav();$("#ttl").textContent=PAGES.find(x=>x[0]==p)[1];$("#v").innerHTML=R[p]();if(p=="accueil")initVid();$("#nav").classList.remove("open");}
const dlg=$("#dlg");
function elForm(id){const e=S.eleves.find(x=>x.id==id)||{nom:"",niveau:"Seconde",classe:"",tel:"",email:"",statut:"Actif"};dlg.innerHTML=`<form id="fe" novalidate style="padding:16px" data-id="${id||""}"><h2 style="margin-top:0">${id?"Modifier":"Ajouter"} un élève</h2><label for="en">Nom complet</label><input id="en" name="nom" value="${esc(e.nom)}"><div class="err" data-e="nom"></div><label for="ev">Niveau</label><select id="ev" name="niveau">${["Seconde","Première","Terminale"].map(n=>`<option ${e.niveau==n?"selected":""}>${n}</option>`).join("")}</select><label for="ec">Classe</label><input id="ec" name="classe" value="${esc(e.classe)}"><div class="err" data-e="classe"></div><label for="ee">E-mail</label><input id="ee" name="email" value="${esc(e.email)}"><div class="err" data-e="email"></div><label for="es">Statut</label><select id="es" name="statut"><option ${e.statut=="Actif"?"selected":""}>Actif</option><option ${e.statut=="Inactif"?"selected":""}>Inactif</option></select><p><button>Enregistrer</button> <button type="button" class="sec" data-a="close">Annuler</button></p></form>`;dlg.showModal()}
const bad=(f,m)=>{Object.entries(m).forEach(([k,v])=>{const e=f.querySelector(`[data-e="${k}"]`);if(e)e.textContent=v});return Object.keys(m).length>0};
const clr=f=>f.querySelectorAll("[data-e]").forEach(e=>e.textContent="");
const mail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
document.addEventListener("submit",e=>{e.preventDefault();if(!CAN){alert("Votre rôle permet seulement la consultation.");return}const f=e.target,d=Object.fromEntries(new FormData(f));clr(f);const m={};
if(f.id=="fe"){if(d.nom.trim().length<3)m.nom="Saisissez un nom d’au moins 3 caractères.";if(!d.classe.trim())m.classe="La classe est obligatoire.";if(d.email&&!mail(d.email))m.email="Format d’e-mail invalide.";if(bad(f,m))return;const id=f.dataset.id;if(id)Object.assign(S.eleves.find(x=>x.id==id),d);else S.eleves.push({id:Date.now(),tel:"",...d});dlg.close();draw()}
if(f.id=="fr"){const mc=S.machines.find(x=>x.id==d.mid);if(!mc)m.mid="Choisissez un équipement.";else if(!mc.dispo)m.mid="Cet équipement est indisponible.";if(!d.date)m.date="La date est obligatoire.";else if(d.date<iso(0))m.date="La date ne peut pas être dans le passé.";if(!d.deb||!d.fin)m.fin="Renseignez l’heure de début et de fin.";else if(d.fin<=d.deb)m.fin="L’heure de fin doit suivre l’heure de début.";if(!d.motif.trim())m.motif="Le motif est obligatoire.";if(!Object.keys(m).length&&S.resa.some(r=>r.mid==d.mid&&r.date==d.date&&r.st!="Annulée"&&d.deb<r.fin&&d.fin>r.deb))m.fin="Conflit : cet équipement est déjà réservé sur ce créneau.";if(bad(f,m))return;S.resa.push({id:Date.now(),mid:+d.mid,date:d.date,deb:d.deb,fin:d.fin,motif:d.motif.trim(),st:"En attente"});draw()}
if(f.id=="fn"){if(!d.obj.trim())m.obj="L’objet est obligatoire.";if(!d.txt.trim())m.txt="Le contenu est obligatoire.";if(bad(f,m))return;const dest=d.dest=="all"?"Tous les apprenants actifs":mn(d.dest);dlg.innerHTML=`<div style="padding:16px"><h2 style="margin-top:0">Aperçu</h2><div class="banner">Envoi simulé : aucune notification ne sera réellement délivrée.</div><p><b>À :</b> ${esc(dest)}</p><p><b>Objet :</b> ${esc(d.obj)}</p><p>${esc(d.txt)}</p><button data-a="envoi" data-o="${esc(d.obj)}" data-d="${esc(dest)}">Confirmer l’envoi simulé</button> <button class="sec" data-a="close">Retour</button></div>`;dlg.showModal()}
if(f.id=="fg"){FS[f.dataset.k].f.forEach(([n,,,r])=>{if(r&&!(d[n]||"").trim())m[n]="Ce champ est obligatoire."});if(bad(f,m))return;const o={...d};if(f.dataset.k=="machines"){o.id=Date.now();o.dispo=o.etat!="En maintenance"}S[f.dataset.k].push(o);dlg.close();draw()}
if(f.id=="fs"){if(!d.nom.trim())m.nom="Le nom est obligatoire.";if(d.email&&!mail(d.email))m.email="Format d’e-mail invalide.";if(bad(f,m))return;Object.assign(S.fab,d);bn(DB?"Paramètres enregistrés.":"Paramètres modifiés (hors connexion).")}save()});
const mn=id=>(S.eleves.find(x=>x.id==id)||{}).nom||"?";
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(!CAN&&a!="close"&&a!="eleve-voir"){alert("Votre rôle permet seulement la consultation.");return}
if(a=="close")dlg.close();if(a=="add")gForm(b.dataset.k);
if(a=="del"&&confirm("Supprimer cet élément ? Cette action est définitive.")){S[b.dataset.k].splice(+b.dataset.i,1);draw()}
if(a=="export"&&ADM)(async()=>{try{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([snap()],{type:"application/json"}));l.download="fablab-donnees.json";l.click()}catch(x){alert("Export impossible ou refusé.")}})();
if(a=="reset"&&ADM&&confirm("Vider toutes les données saisies (élèves, réservations, projets…) ? Action irréversible.")){Object.assign(S,{eleves:[],formateurs:[],resa:[],projets:[],act:[],notifs:[],envois:[]});draw()}
if(a=="eleve-form")elForm(id);
if(a=="eleve-voir"){const x=S.eleves.find(y=>y.id==id);dlg.innerHTML=`<div style="padding:16px"><h2 style="margin-top:0">${esc(x.nom)}</h2><p>${x.niveau} · ${esc(x.classe)}</p><p>${esc(x.email||"E-mail non renseigné")}</p><p>${tag(x.statut)}</p><button data-a="close">Fermer</button></div>`;dlg.showModal()}
if(a=="notif-lu"){const n=S.notifs.find(x=>x.id==id);n.lu=!n.lu;draw()}
if(a=="envoi"){S.envois.unshift({obj:b.dataset.o,dest:b.dataset.d});S.notifs.unshift({id:Date.now(),date:iso(0),txt:"Envoi simulé : "+b.dataset.o,lu:true});dlg.close();draw()}save()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a=="resa-st"){const r=S.resa.find(x=>x.id==t.dataset.id);if(!CAN){alert("Votre rôle permet seulement la consultation.");draw();return}if(t.value=="Annulée"&&!confirm("Annuler cette réservation ?")){draw();return}r.st=t.value;draw();save()}
if(t.dataset.f){F[t.dataset.f]=t.value;draw()}if(t.id=="th"){document.documentElement.dataset.theme=t.value}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f&&t.tagName=="INPUT"){F[t.dataset.f]=t.value;const p=t.selectionStart;draw();const n=document.getElementById(t.id);n.focus();n.setSelectionRange(p,p)}});
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
const lerr=c=>({"auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/email-already-in-use":"Cet e-mail a déjà un compte.","auth/weak-password":"Mot de passe trop court (6 caractères minimum).","auth/invalid-email":"Adresse e-mail invalide.","auth/network-request-failed":"Pas de connexion Internet."}[c]||"Opération impossible. Réessayez.");
const lgo=async f=>{const e=$("#le").value.trim(),p=$("#lp").value;$("#lmsg").textContent="";if(!e||!p){$("#lmsg").textContent="Saisissez l’e-mail et le mot de passe.";return}try{await f(e,p)}catch(x){$("#lmsg").textContent=lerr(x.code)}};
$("#lf").onsubmit=ev=>{ev.preventDefault();lgo((e,p)=>FB.login(e,p))};$("#lr").onclick=()=>lgo((e,p)=>FB.register(e,p));
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a=="role"&&ADM&&confirm("Changer le rôle de cet utilisateur ?"))FB.setRole(t.dataset.uid,t.value).then(()=>bn("Rôle mis à jour.")).catch(()=>bn("Échec de la mise à jour du rôle."))});
addEventListener("hashchange",draw);draw();boot();
</script></body></html>
